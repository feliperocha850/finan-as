<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças Família Rocha</title>
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Família Rocha">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

/* Direção: preto profundo, dourado só onde há destaque (marca, mês ativo, ação principal, foco),
   texto branco. Verde e vermelho aparecem apenas para entrada e saída.
   Layout: faixa de 4 totais no topo; abaixo, saldo e categorias lado a lado, lista embaixo. */
:root {
  --fundo: #050505;
  --superficie: #0F0F0F;
  --superficie-2: #171614;
  --linha: #2B2619;
  --dourado: #D4AF5A;
  --dourado-claro: #F2D98E;
  --dourado-escuro: #8C6F2C;
  --texto: #F7F5EF;
  --texto-suave: #A9A396;
  --positivo: #3FD08A;
  --negativo: #FF5D5D;
  --raio: 18px;
  --fonte-corpo: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fonte-titulo: 'Fraunces', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte-corpo);
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--dourado); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }

.app { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }

/* ---------- topo ---------- */
.topo { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding-bottom: 20px; }
.marca { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.marca-selo {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  font-family: var(--fonte-titulo); font-weight: 700; font-size: 20px; color: #1a1405;
  background: linear-gradient(145deg, var(--dourado-claro), var(--dourado) 55%, var(--dourado-escuro));
  box-shadow: 0 6px 18px rgba(212, 175, 90, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.marca-nome { font-family: var(--fonte-titulo); font-weight: 700; font-size: 20px; letter-spacing: 0.01em; }

.mes { display: flex; align-items: center; gap: 6px; }
.mes-seta {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linha);
  background: var(--superficie); display: grid; place-items: center; color: var(--texto-suave);
}
.mes-seta:hover { color: var(--dourado); border-color: var(--dourado-escuro); }
.mes-atual {
  min-width: 150px; text-align: center; font-family: var(--fonte-titulo); font-weight: 700; font-size: 18px;
  padding: 6px 14px; border-radius: 999px; background: var(--superficie-2); border: 1px solid var(--dourado-escuro);
  color: var(--dourado-claro);
}

.acoes { display: flex; flex-wrap: wrap; gap: 10px; }
.botao-principal, .botao-sec {
  border-radius: 999px; padding: 9px 18px; font-weight: 700; border: 1px solid transparent;
}
.botao-principal {
  color: #1a1405;
  background: linear-gradient(145deg, var(--dourado-claro), var(--dourado) 60%, var(--dourado-escuro));
  box-shadow: 0 6px 20px rgba(212, 175, 90, 0.22);
}
.botao-principal:hover { filter: brightness(1.07); }
.botao-sec { background: transparent; border-color: var(--linha); color: var(--texto); }
.botao-sec:hover { border-color: var(--dourado-escuro); color: var(--dourado-claro); }

.aviso {
  margin: 0 0 16px; padding: 12px 16px; border-radius: 12px; font-weight: 600;
  background: rgba(255, 93, 93, 0.1); border: 1px solid var(--negativo); color: #ffd3d3;
}

/* ---------- grade ---------- */
.principal { display: flex; flex-direction: column; gap: 18px; }
.resumo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.grade {
  display: grid; gap: 18px;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  grid-template-areas: 'saldo categorias' 'lista categorias';
  align-items: start;
}
.area-saldo { grid-area: saldo; }
.area-categorias { grid-area: categorias; }
.area-lista { grid-area: lista; }

.cartao {
  background: linear-gradient(180deg, var(--superficie-2), var(--superficie));
  border: 1px solid var(--linha); border-radius: var(--raio); padding: 20px;
}
.cartao-titulo { font-family: var(--fonte-titulo); font-weight: 700; font-size: 19px; margin-bottom: 14px; }

@media (max-width: 900px) {
  .resumo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grade { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'saldo' 'categorias' 'lista'; }
}
@media (max-width: 480px) {
  .app { padding: 16px; }
  .acoes { width: 100%; }
  .acoes .botao-principal { flex: 1 1 100%; order: -1; }
  .mes { width: 100%; justify-content: space-between; }
  .mes-atual { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- resumo ---------- */
.tile {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--raio);
  background: linear-gradient(180deg, var(--superficie-2), var(--superficie)); border: 1px solid var(--linha);
}
.tile-icone { flex: none; width: 54px; height: 54px; display: grid; place-items: center; }
.tile-texto { min-width: 0; }
.tile-rotulo { color: var(--texto-suave); font-size: 13px; font-weight: 600; }
.tile-valor { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
.tile-comp { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--texto-suave); }
.tile-comp-ref { color: var(--texto-suave); font-weight: 500; }
.cor-positivo { color: var(--positivo); }
.cor-negativo { color: var(--negativo); }
.cor-dourado { color: var(--dourado-claro); }
.fundo-positivo { background: var(--positivo); }
.fundo-negativo { background: var(--negativo); }

/* ---------- saldo ---------- */
.legenda { color: var(--texto-suave); font-size: 13px; margin: -8px 0 12px; }
.grafico svg { display: block; width: 100%; height: auto; }

/* ---------- categorias ---------- */
.rosca { display: grid; place-items: center; margin: 4px 0 14px; }
.cat-lista, .itens { list-style: none; margin: 0; padding: 0; }
.cat-lista { display: flex; flex-direction: column; gap: 4px; }
.cat-linha {
  width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 2px 12px;
  text-align: left; padding: 8px 10px; border-radius: 14px; background: transparent; border: 1px solid transparent;
}
.cat-linha:hover { background: var(--superficie-2); }
.cat-linha[aria-pressed="true"] { border-color: var(--dourado-escuro); background: var(--superficie-2); }
.cat-icone { grid-row: span 2; display: grid; place-items: center; }
.cat-nome { font-weight: 700; display: flex; flex-direction: column; }
.cat-pct { font-size: 12px; font-weight: 500; color: var(--texto-suave); }
.cat-total { font-weight: 800; }
.barra { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: #231f15; overflow: hidden; margin-top: 4px; }
.barra-preench { display: block; height: 100%; border-radius: 3px; }
.limite-txt { grid-column: 2 / 4; font-size: 12px; color: var(--texto-suave); }
.vazio { padding: 24px 8px; text-align: center; color: var(--texto-suave); list-style: none; }

/* ---------- lista ---------- */
.lista-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lista-cab .legenda { margin: 0; }
.filtros { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; margin-bottom: 8px; }
.filtros input, .filtros select {
  min-width: 0; background: #0a0a0a; border: 1px solid var(--linha); border-radius: 10px; padding: 9px 12px;
}
.filtros input::placeholder { color: var(--texto-suave); }
.item {
  width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  text-align: left; padding: 10px 8px; background: transparent; border: 0; border-bottom: 1px solid #1c1910; border-radius: 10px;
}
.item:hover { background: var(--superficie-2); }
.item-icone { display: grid; place-items: center; }
.item-corpo { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-desc { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; color: var(--texto-suave); }
.item-valor { font-weight: 800; white-space: nowrap; }
.chip {
  border: 1px solid var(--dourado-escuro); color: var(--dourado-claro); border-radius: 999px; padding: 0 8px; font-weight: 700;
}
.forma { font-weight: 600; }

@media (max-width: 900px) {
  .tile-valor { font-size: 19px; }
}
@media (max-width: 560px) {
  .resumo { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; }
  .tile-icone { width: 44px; height: 44px; }
  .tile-icone svg { width: 100%; height: 100%; }
  .tile-valor { font-size: 17px; }
  .filtros { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .filtros input { grid-column: 1 / -1; }
  .cartao { padding: 16px; }
}

/* ---------- janelas e formulários ---------- */
.fundo-modal {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: rgba(0, 0, 0, 0.74); overflow-y: auto;
}
.modal {
  width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 22px;
  background: linear-gradient(180deg, #1b1911, #0f0f0f); border: 1px solid var(--dourado-escuro); border-radius: 20px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
}
.modal-larga { width: min(720px, 100%); }
.modal-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-cab .cartao-titulo { margin: 0; }
.modal-fechar, .botao-icone {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--linha); background: transparent;
  display: grid; place-items: center; color: var(--texto-suave);
}
.modal-fechar:hover { color: var(--dourado-claro); border-color: var(--dourado-escuro); }
.botao-icone:hover { color: var(--negativo); border-color: var(--negativo); }
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.rotulo { font-size: 13px; font-weight: 700; color: var(--texto-suave); }
.modal input:not([type="radio"]):not([type="color"]), .modal select {
  width: 100%; min-width: 0; background: #0a0a0a; border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px;
}
.linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: flex; gap: 6px; }
.seg-op { position: relative; flex: 1 1 0; min-width: 0; }
.seg-op input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg-op span {
  display: block; text-align: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--linha);
  font-weight: 700; background: #0a0a0a;
}
.seg-op input:checked + span { border-color: var(--dourado); background: var(--superficie-2); color: var(--dourado-claro); }
.seg-entrada input:checked + span { border-color: var(--positivo); color: var(--positivo); background: rgba(63, 208, 138, 0.1); }
.seg-saida input:checked + span { border-color: var(--negativo); color: var(--negativo); background: rgba(255, 93, 93, 0.1); }
.seg-op input:focus-visible + span { outline: 2px solid var(--dourado); outline-offset: 2px; }
.seg-op.desativado { opacity: 0.35; }
.seg-op.desativado input { cursor: not-allowed; }
.bloco-credito { border: 1px solid var(--linha); border-radius: 14px; padding: 14px 14px 2px; margin-bottom: 14px; background: #0c0b08; }
.ajuda { color: var(--texto-suave); font-size: 13px; margin-bottom: 12px; }
.ajuda-destaque { color: var(--dourado-claro); }
.erros {
  color: #ffd3d3; background: rgba(255, 93, 93, 0.1); border: 1px solid var(--negativo); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 12px; font-weight: 600;
}
.modal-rodape { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; }
.espaco { flex: 1; }
.botao-perigo { background: transparent; border: 1px solid var(--negativo); color: var(--negativo); border-radius: 999px; padding: 9px 18px; font-weight: 700; }
.botao-perigo-cheio { background: var(--negativo); color: #2a0505; border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 800; }
.botao-principal:disabled { opacity: 0.6; cursor: wait; }
.texto-modal { margin-bottom: 16px; }
.cat-linhas { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.cat-edit { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px 130px 100px; gap: 8px; align-items: center; }
.cat-edit.removida .ce-nome, .cat-edit.removida .ce-cor, .cat-edit.removida .ce-limite, .cat-edit.removida .cat-icone { opacity: 0.4; }
.ce-cor { padding: 2px; height: 40px; width: 44px; border-radius: 10px; background: transparent; border: 1px solid var(--linha); }
.ce-aviso { grid-column: 2 / -1; font-size: 12px; color: var(--negativo); }
.ce-fixa { font-size: 12px; color: var(--texto-suave); text-align: center; }

@media (max-width: 560px) {
  .fundo-modal { place-items: end center; padding: 0; }
  .modal { width: 100%; max-height: 92%; border-radius: 20px 20px 0 0; padding: 18px 16px 22px; }
  .cat-edit { grid-template-columns: 36px minmax(0, 1fr) 44px; }
  .cat-edit .cat-icone { grid-row: span 2; }
  .cat-edit .ce-limite { grid-column: 2 / 3; }
  .cat-edit [data-acao], .cat-edit .ce-fixa { grid-column: 3; }
}

/* ---------- login (versão instalável) ---------- */
.fundo-login { background: var(--fundo); z-index: 100; }
.login { width: min(400px, 100%); }
.login-marca { margin-bottom: 18px; }
.login-entrar { width: 100%; margin-top: 4px; padding: 12px 18px; }
@media (max-width: 560px) {
  .fundo-login { place-items: center; padding: 16px; }
  .login { border-radius: 20px; }
}

.marca-selo svg { width: 24px; height: auto; display: block; }
.login-marca .marca-nome { font-size: 19px; }

</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="marca">
      <span class="marca-selo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="105 130 360 260" aria-hidden="true"><g fill="#050505" stroke="#050505" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="160" cy="168" r="26" stroke="none"/>
  <rect x="135" y="203" width="50" height="92" rx="22" stroke="none"/>
  <path d="M152 295v72M170 295v72" stroke-width="18" fill="none"/>

  <circle cx="285" cy="168" r="26" stroke="none"/>

  <path d="M258 218l-38 54" stroke-width="15" fill="none"/>

  <circle cx="414" cy="266" r="44" fill="none" stroke-width="12"/>
  <path d="M414 238v56M429 252c-4-8-30-10-30 4 0 15 30 10 30 25 0 13-27 11-33 3" stroke-width="10" fill="none"/>
</g>
</svg></span>
      <span class="marca-nome">Finanças Família Rocha</span>
    </div>
    <nav class="mes" id="seletor-mes" aria-label="Mês exibido"></nav>
    <div class="acoes">
      <button id="btn-atualizar" class="botao-sec" type="button">Atualizar</button>
      <button id="btn-categorias" class="botao-sec" type="button">Categorias</button>
      <button id="btn-exportar" class="botao-sec" type="button">Exportar CSV</button>
      <button id="btn-sair" class="botao-sec" type="button" hidden>Sair</button>
      <button id="btn-novo" class="botao-principal" type="button">Novo lançamento</button>
    </div>
  </header>
  <div id="aviso" class="aviso" role="alert" hidden></div>
  <main class="principal">
    <section id="resumo" class="resumo" aria-label="Resumo do mês"></section>
    <div class="grade">
      <section id="saldo" class="cartao area-saldo" aria-label="Evolução do saldo"></section>
      <section id="categorias" class="cartao area-categorias" aria-label="Gastos por categoria"></section>
      <section id="lista" class="cartao area-lista" aria-label="Lançamentos"></section>
    </div>
  </main>
</div>

<script>
(function (raiz, fabrica) {
  if (typeof module === 'object' && module.exports) module.exports = fabrica();
  else raiz.Financas = fabrica();
})(this, function () {
  'use strict';

  // ---------- dinheiro ----------

  // "1.234,56" -> 123456 (centavos). Inválido, zero ou negativo -> null.
  function parseValor(texto) {
    if (typeof texto !== 'string') return null;
    const t = texto.replace(/R\$/gi, '').replace(/\s+/g, '');
    if (!/^(\d{1,3}(\.\d{3})+|\d+)(,\d{1,2})?$/.test(t)) return null;
    const [inteiro, dec = ''] = t.split(',');
    const reais = parseInt(inteiro.replace(/\./g, ''), 10);
    const centavos = parseInt((dec + '00').slice(0, 2), 10);
    const total = reais * 100 + centavos;
    return total > 0 ? total : null;
  }

  const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  function formatBRL(centavos) {
    return fmtBRL.format(centavos / 100);
  }

  // ---------- datas (texto AAAA-MM-DD, sem Date) ----------

  function pad2(n) { return String(n).padStart(2, '0'); }
  function bissexto(a) { return (a % 4 === 0 && a % 100 !== 0) || a % 400 === 0; }

  function diasDoMes(mes) {
    const [a, m] = mes.split('-').map(Number);
    if (m === 2) return bissexto(a) ? 29 : 28;
    return [4, 6, 9, 11].includes(m) ? 30 : 31;
  }

  function dataValida(iso) {
    if (typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
    const [a, m, d] = iso.split('-').map(Number);
    if (a < 1900 || m < 1 || m > 12 || d < 1) return false;
    return d <= diasDoMes(iso.slice(0, 7));
  }

  function mesDe(iso) { return iso.slice(0, 7); }

  function formatData(iso) {
    const [a, m, d] = iso.split('-');
    return d + '/' + m + '/' + a;
  }

  function somarMeses(mes, n) {
    const [a, m] = mes.split('-').map(Number);
    const total = a * 12 + (m - 1) + n;
    const ano = Math.floor(total / 12);
    const mm = total - ano * 12 + 1;
    return ano + '-' + pad2(mm);
  }

  // Soma n meses a uma data, prendendo o dia ao fim do mês quando preciso.
  function dataNoMes(iso, n) {
    const mes = somarMeses(mesDe(iso), n);
    const dia = Math.min(parseInt(iso.slice(8, 10), 10), diasDoMes(mes));
    return mes + '-' + pad2(dia);
  }

  // ---------- html ----------

  function escaparHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---------- parcelas e agregações ----------

  // Uma compra no crédito em N vezes vira N ocorrências, uma por mês.
  // O resto da divisão vai, centavo a centavo, para as primeiras parcelas.
  function expandirParcelas(l) {
    const n = l.forma === 'credito' && Number.isInteger(l.parcelas) && l.parcelas > 1 ? l.parcelas : 1;
    const base = Math.floor(l.valor / n);
    const resto = l.valor - base * n;
    return Array.from({ length: n }, (_, i) => {
      const o = {
        lancamentoId: l.id, tipo: l.tipo, data: dataNoMes(l.data, i), descricao: l.descricao,
        valor: base + (i < resto ? 1 : 0), categoriaId: l.categoriaId, forma: l.forma,
        parcelaNum: i + 1, parcelaTotal: n,
      };
      if (l.cartao) o.cartao = l.cartao;
      return o;
    });
  }

  function ocorrenciasDoMes(lancamentos, mes) {

  // Data de hoje como texto, pelo relógio local (nunca por UTC).
  function hoje() {
    const d = new Date();
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const rotuloMes = (mes) => cap(MESES[parseInt(mes.slice(5), 10) - 1]) + ' ' + mes.slice(0, 4);
  const mesCurto = (mes) => MESES[parseInt(mes.slice(5), 10) - 1].slice(0, 3);

  const OUTROS = { id: 'outros', nome: 'Outros', cor: '#6B7280', limite: null };
  const categoria = (id) => estado.categorias.find((c) => c.id === id) || OUTROS;

  const SETA = (d) => '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>';

  // ---------- topo ----------

  function renderSeletorMes() {
    $('seletor-mes').innerHTML =
      '<button type="button" class="mes-seta" data-dir="-1" aria-label="Mês anterior">' + SETA('M10 3 L5 8 L10 13') + '</button>' +
      '<span class="mes-atual" aria-live="polite">' + e(rotuloMes(estado.mes)) + '</span>' +
      '<button type="button" class="mes-seta" data-dir="1" aria-label="Próximo mês">' + SETA('M6 3 L11 8 L6 13') + '</button>';
  }

  // ---------- resumo ----------

  function comparacao(comp, anteriorMes, temAnterior, bomQuandoSobe) {
    if (!temAnterior) return '<span class="tile-comp">Sem dados em ' + mesCurto(anteriorMes) + '</span>';
    const delta = comp.delta;
    if (delta === 0) return '<span class="tile-comp">Igual a ' + mesCurto(anteriorMes) + '</span>';
    const sobe = delta > 0;
    const cor = sobe === bomQuandoSobe ? 'cor-positivo' : 'cor-negativo';
    const quanto = comp.percentual === null ? brl(Math.abs(delta)) : Math.round(Math.abs(comp.percentual)) + '%';
    return '<span class="tile-comp ' + cor + '">' + (sobe ? '▲' : '▼') + ' ' + quanto + ' <span class="tile-comp-ref">vs ' + mesCurto(anteriorMes) + '</span></span>';
  }

  function renderResumo(totais, anterior, temAnterior) {
    const ant = F.somarMeses(estado.mes, -1);
    const comp = F.compararMeses(totais, anterior);
    const pctCartao = totais.saidas > 0 ? Math.round((totais.credito / totais.saidas) * 100) : 0;
    const tile = (icone, rotulo, valor, cor, extra) =>
      '<article class="tile"><span class="tile-icone">' + I.svgIcone(icone, 54) + '</span>' +
      '<div class="tile-texto"><p class="tile-rotulo">' + rotulo + '</p>' +
      '<p class="tile-valor ' + cor + '">' + valor + '</p>' + extra + '</div></article>';
    $('resumo').innerHTML =
      tile('entrada', 'Entradas', brl(totais.entradas), 'cor-positivo', comparacao(comp.entradas, ant, temAnterior, true)) +
      tile('saida', 'Saídas', brl(totais.saidas), 'cor-negativo', comparacao(comp.saidas, ant, temAnterior, false)) +
      tile('dinheiro', 'Saldo do mês', brl(totais.saldo), totais.saldo >= 0 ? 'cor-positivo' : 'cor-negativo', comparacao(comp.saldo, ant, temAnterior, true)) +
      tile('cartao', 'No cartão de crédito', brl(totais.credito), 'cor-dourado',
        '<span class="tile-comp">' + (totais.saidas > 0 ? pctCartao + '% das saídas' : 'Nenhum gasto no mês') + '</span>');
  }

  // ---------- saldo ----------

  function renderSaldo(oc) {
    const serie = F.serieSaldoDiario(oc, estado.mes);
    $('saldo').innerHTML =
      '<h2 class="cartao-titulo">Evolução do saldo</h2>' +
      '<p class="legenda">Entradas menos saídas, somadas dia a dia</p>' +
      '<div class="grafico">' + G.svgLinhaSaldo(serie, { largura: 640, altura: 230 }) + '</div>';
  }

  // ---------- categorias ----------

  function renderCategorias(oc, totais) {
    const gastos = F.gastosPorCategoria(oc, estado.categorias);
    const sel = estado.filtro.categoriaId;
    const rosca = G.svgRosca(gastos.map((g) => ({ id: g.categoriaId, cor: g.cor, valor: g.total })),
      { tamanho: 240, selecionadoId: sel, centro: { titulo: 'Total de gastos', valor: brl(totais.saidas) } });
    const linhas = gastos.map((g) => {
      const barra = g.limite
        ? '<span class="barra"><span class="barra-preench ' + (g.estourou ? 'fundo-negativo' : 'fundo-positivo') +
          '" style="width:' + Math.min(100, Math.round(g.usoLimite * 100)) + '%"></span></span>' +
          '<span class="limite-txt ' + (g.estourou ? 'cor-negativo' : '') + '">' + brl(g.total) + ' de ' + brl(g.limite) +
          (g.estourou ? ' (limite estourado)' : '') + '</span>'
        : '';
      return '<li><button type="button" class="cat-linha" data-cat="' + e(g.categoriaId) + '" aria-pressed="' + (sel === g.categoriaId) + '">' +
        '<span class="cat-icone">' + I.svgIcone(g.categoriaId, 40) + '</span>' +
        '<span class="cat-nome">' + e(g.nome) + '<span class="cat-pct">' + Math.round(g.percentual) + '% dos gastos</span></span>' +
        '<span class="cat-total">' + brl(g.total) + '</span>' + barra + '</button></li>';
    }).join('');
    $('categorias').innerHTML =
      '<h2 class="cartao-titulo">Gastos por categoria</h2>' +
      '<div class="rosca" id="rosca">' + rosca + '</div>' +
      (gastos.length ? '<ul class="cat-lista">' + linhas + '</ul>' : '<p class="vazio">Nenhum gasto neste mês.</p>');
  }

  // ---------- lista ----------

  const NOME_FORMA = { debito: 'Débito', credito: 'Crédito', pix: 'Pix', dinheiro: 'Dinheiro' };

  function montarLista() {
    $('lista').innerHTML =
      '<div class="lista-cab"><h2 class="cartao-titulo">Lançamentos</h2><span id="lista-conta" class="legenda"></span></div>' +
      '<div class="filtros">' +
      '<input id="f-busca" type="search" placeholder="Buscar lançamento" aria-label="Buscar lançamento" autocomplete="off">' +
      '<select id="f-tipo" aria-label="Tipo"><option value="">Todos os tipos</option><option value="entrada">Entradas</option><option value="saida">Saídas</option></select>' +
      '<select id="f-cat" aria-label="Categoria"></select></div>' +
      '<ul id="lista-itens" class="itens"></ul>';
    montarFiltroCategorias();
  }

  function montarFiltroCategorias() {
    const el = $('f-cat');
    if (!el) return;
    el.innerHTML = '<option value="">Todas as categorias</option>' +
      estado.categorias.map((c) => '<option value="' + e(c.id) + '">' + e(c.nome) + '</option>').join('');
    el.value = estado.filtro.categoriaId;
  }

  function renderLista(oc) {
    const itens = F.filtrarOcorrencias(oc, estado.filtro);
    const filtrado = estado.filtro.busca || estado.filtro.tipo || estado.filtro.categoriaId;
    $('lista-conta').textContent = itens.length + (itens.length === 1 ? ' lançamento' : ' lançamentos');
    $('f-cat').value = estado.filtro.categoriaId;
    if (!itens.length) {
      $('lista-itens').innerHTML = '<li class="vazio">' + (filtrado
        ? 'Nada encontrado com esses filtros.'
        : 'Nenhum lançamento neste mês. Use “Novo lançamento” para começar.') + '</li>';
      return;
    }
    $('lista-itens').innerHTML = itens.map((o) => {
      const c = categoria(o.categoriaId);
      const entrada = o.tipo === 'entrada';
      let chip = '';
      if (o.forma === 'credito') {
        chip = '<span class="chip">Crédito' + (o.cartao ? ' ' + e(o.cartao) : '') + (o.parcelaTotal > 1 ? ' ' + o.parcelaNum + '/' + o.parcelaTotal : '') + '</span>';
      } else {
        chip = '<span class="forma">' + (NOME_FORMA[o.forma] || '') + '</span>';
      }
      return '<li><button type="button" class="item" data-lanc="' + e(o.lancamentoId) + '">' +
        '<span class="item-icone">' + I.svgIcone(c.id, 40) + '</span>' +
        '<span class="item-corpo"><span class="item-desc">' + e(o.descricao) + '</span>' +
        '<span class="item-meta"><span>' + F.formatData(o.data).slice(0, 5) + '</span><span>' + e(c.nome) + '</span>' + chip + '</span></span>' +
        '<span class="item-valor ' + (entrada ? 'cor-positivo' : 'cor-negativo') + '">' + (entrada ? '+ ' : '− ') + brl(o.valor) + '</span>' +
        '</button></li>';
    }).join('');
  }

  // ---------- geral ----------

  function renderizar() {
    const oc = F.ocorrenciasDoMes(estado.lancamentos, estado.mes);
    const totais = F.totaisDoMes(oc);
    const ocAnt = F.ocorrenciasDoMes(estado.lancamentos, F.somarMeses(estado.mes, -1));
    const anterior = F.totaisDoMes(ocAnt);
    renderSeletorMes();
    renderResumo(totais, anterior, ocAnt.length > 0);
    renderSaldo(oc);
    renderCategorias(oc, totais);
    renderLista(oc);
  }

  function alternarCategoria(id) {
    estado.filtro.categoriaId = estado.filtro.categoriaId === id ? '' : id;
    renderizar();
  }

  function ligarEventos() {
    $('seletor-mes').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-dir]');
      if (!b) return;
      estado.mes = F.somarMeses(estado.mes, parseInt(b.dataset.dir, 10));
      renderizar();
    });
    $('categorias').addEventListener('click', (ev) => {
      const alvo = ev.target.closest('[data-cat], [data-id]');
      if (alvo) alternarCategoria(alvo.dataset.cat || alvo.dataset.id);
    });
    $('btn-exportar').addEventListener('click', exportarCsv);
    $('btn-atualizar').addEventListener('click', () => atualizar(false));
    // Ao voltar para a página depois de um tempo, lê o banco de novo.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Date.now() - ultimaLeitura > 30000) atualizar(true);
    });
    window.addEventListener('focus', () => {
      if (Date.now() - ultimaLeitura > 30000) atualizar(true);
    });
    $('btn-novo').addEventListener('click', () => abrirFormulario());
    $('btn-categorias').addEventListener('click', abrirCategorias);
    $('lista').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-lanc]');
      if (b) abrirFormulario(b.dataset.lanc);
    });
    $('lista').addEventListener('input', (ev) => {
      if (ev.target.id === 'f-busca') { estado.filtro.busca = ev.target.value; renderizar(); $('f-busca').focus(); }
    });
    $('lista').addEventListener('change', (ev) => {
      if (ev.target.id === 'f-tipo') { estado.filtro.tipo = ev.target.value; renderizar(); }
      if (ev.target.id === 'f-cat') { estado.filtro.categoriaId = ev.target.value; renderizar(); }
    });
  }

  // ---------- janelas ----------

  let modalAberto = null;
  function escListener(ev) { if (ev.key === 'Escape') fecharModal(); }
  function fecharModal() {
    if (!modalAberto) return;
    modalAberto.fundo.remove();
    document.removeEventListener('keydown', escListener);
    if (modalAberto.ultimoFoco && modalAberto.ultimoFoco.focus) modalAberto.ultimoFoco.focus();
    modalAberto = null;
  }
  function abrirModal(titulo, corpo, larga) {
    const ultimoFoco = modalAberto ? modalAberto.ultimoFoco : document.activeElement;
    if (modalAberto) { modalAberto.fundo.remove(); document.removeEventListener('keydown', escListener); modalAberto = null; }
    const fundo = document.createElement('div');
    fundo.className = 'fundo-modal';
    fundo.innerHTML = '<div class="modal' + (larga ? ' modal-larga' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">' +
      '<div class="modal-cab"><h2 id="modal-titulo" class="cartao-titulo">' + e(titulo) + '</h2>' +
      '<button type="button" class="modal-fechar" aria-label="Fechar">' + SETA('M3 3 L13 13 M13 3 L3 13') + '</button></div>' + corpo + '</div>';
    $('camada').appendChild(fundo);
    fundo.addEventListener('mousedown', (ev) => { if (ev.target === fundo) fecharModal(); });
    fundo.querySelector('.modal-fechar').addEventListener('click', fecharModal);
    document.addEventListener('keydown', escListener);
    modalAberto = { fundo, ultimoFoco };
    const primeiro = fundo.querySelector('input:not([type="radio"]), select, button.botao-principal');
    if (primeiro) primeiro.focus();
    return fundo.querySelector('.modal');
  }

  // ---------- lançamento: formulário ----------

  const FORMAS = [['debito', 'Débito'], ['credito', 'Crédito'], ['pix', 'Pix'], ['dinheiro', 'Dinheiro']];

  function segmentado(nome, opcoes, atual) {
    return '<div class="seg" role="radiogroup">' + opcoes.map(([val, rot]) =>
      '<label class="seg-op seg-' + val + '"><input type="radio" name="' + nome + '" value="' + val + '"' +
      (atual === val ? ' checked' : '') + '><span>' + rot + '</span></label>').join('') + '</div>';
  }

  function htmlFormulario(l) {
    const v = l || {
      tipo: 'saida', data: hoje(), descricao: '', valor: null,
      categoriaId: estado.categorias[0] ? estado.categorias[0].id : 'outros', forma: 'debito', cartao: '', parcelas: 1,
    };
    const valorTxt = v.valor ? (v.valor / 100).toFixed(2).replace('.', ',') : '';
    const cartoes = [...new Set(estado.lancamentos.map((x) => x.cartao).filter(Boolean))];
    const aviso = l && l.forma === 'credito' && l.parcelas > 1
      ? '<p class="ajuda ajuda-destaque">Compra em ' + l.parcelas + ' parcelas. Mudar algo aqui altera todas elas.</p>' : '';
    return '<form id="form-lanc" novalidate>' + aviso +
      '<div class="campo"><span class="rotulo">Tipo</span>' + segmentado('tipo', [['saida', 'Saída'], ['entrada', 'Entrada']], v.tipo) + '</div>' +
      '<div class="linha2">' +
      '<div class="campo"><label class="rotulo" for="lf-valor">Valor</label><input id="lf-valor" name="valor" inputmode="decimal" placeholder="0,00" value="' + valorTxt + '" autocomplete="off"></div>' +
      '<div class="campo"><label class="rotulo" for="lf-data">Data</label><input id="lf-data" name="data" type="date" value="' + e(v.data) + '"></div></div>' +
      '<div class="campo"><label class="rotulo" for="lf-desc">Descrição</label><input id="lf-desc" name="descricao" value="' + e(v.descricao) + '" maxlength="80" autocomplete="off"></div>' +
      '<div class="campo"><label class="rotulo" for="lf-cat">Categoria</label><select id="lf-cat" name="categoriaId">' +
      estado.categorias.map((c) => '<option value="' + e(c.id) + '"' + (c.id === v.categoriaId ? ' selected' : '') + '>' + e(c.nome) + '</option>').join('') +
      '</select></div>' +
      '<div class="campo"><span class="rotulo">Forma de pagamento</span>' + segmentado('forma', FORMAS, v.forma) + '</div>' +
      '<div id="bloco-credito" class="bloco-credito"' + (v.forma === 'credito' ? '' : ' hidden') + '>' +
      '<div class="linha2">' +
      '<div class="campo"><label class="rotulo" for="lf-cartao">Cartão</label><input id="lf-cartao" name="cartao" list="lista-cartoes" value="' + e(v.cartao || '') + '" maxlength="30" autocomplete="off" placeholder="Ex.: Nubank">' +
      '<datalist id="lista-cartoes">' + cartoes.map((c) => '<option value="' + e(c) + '">').join('') + '</datalist></div>' +
      '<div class="campo"><label class="rotulo" for="lf-parcelas">Parcelas</label><input id="lf-parcelas" name="parcelas" type="number" min="1" max="48" step="1" inputmode="numeric" value="' + (v.parcelas || 1) + '"></div></div>' +
      '<p id="ajuda-parcelas" class="ajuda"></p></div>' +
      '<p id="erros-form" class="erros" role="alert" hidden></p>' +
      '<div class="modal-rodape">' + (l ? '<button type="button" id="btn-apagar" class="botao-perigo">Apagar</button>' : '') +
      '<span class="espaco"></span><button type="button" class="botao-sec" id="btn-cancelar">Cancelar</button>' +
      '<button type="submit" class="botao-principal" id="btn-salvar">Salvar</button></div></form>';
  }

  function abrirFormulario(id) {
    if (estado.semBanco) return;
    const l = id ? estado.lancamentos.find((x) => x.id === id) : null;
    const modal = abrirModal(l ? 'Editar lançamento' : 'Novo lançamento', htmlFormulario(l));
    const form = modal.querySelector('#form-lanc');
    const erros = modal.querySelector('#erros-form');

    const atualizar = () => {
      const entrada = form.elements.tipo.value === 'entrada';
      const cred = form.querySelector('input[name="forma"][value="credito"]');
      cred.disabled = entrada;
      cred.closest('.seg-op').classList.toggle('desativado', entrada);
      if (entrada && form.elements.forma.value === 'credito') form.querySelector('input[name="forma"][value="pix"]').checked = true;
      const credito = form.elements.forma.value === 'credito';
      modal.querySelector('#bloco-credito').hidden = !credito;
      const ajuda = modal.querySelector('#ajuda-parcelas');
      ajuda.textContent = '';
      if (credito) {
        const valor = F.parseValor(form.elements.valor.value);
        const n = Number(form.elements.parcelas.value);
        const data = form.elements.data.value;
        if (valor && Number.isInteger(n) && n > 1 && n <= 48 && F.dataValida(data)) {
          const primeira = F.expandirParcelas({ id: 'x', tipo: 'saida', data, descricao: '', valor, categoriaId: '', forma: 'credito', parcelas: n })[0];
          ajuda.textContent = n + ' parcelas de ' + brl(primeira.valor) + ', uma por mês a partir de ' + rotuloMes(F.mesDe(data)).toLowerCase() + '.';
        }
      }
    };
    form.addEventListener('input', atualizar);
    form.addEventListener('change', atualizar);
    atualizar();

    modal.querySelector('#btn-cancelar').addEventListener('click', fecharModal);
    const apagar = modal.querySelector('#btn-apagar');
    if (apagar) apagar.addEventListener('click', () => confirmarApagar(l));

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const campos = {};
      for (const [k, val] of new FormData(form).entries()) campos[k] = val;
      const r = F.montarLancamento(campos, l ? l.id : undefined);
      if (!r.lancamento) {
        erros.innerHTML = r.erros.map(e).join('<br>');
        erros.hidden = false;
        return;
      }
      const botao = modal.querySelector('#btn-salvar');
      botao.disabled = true;
      try {
        await estado.loja.salvarLancamentos([r.lancamento]);
      } catch (err) {
        erros.textContent = textoErro(err, 'Não foi possível salvar. Tente de novo.');
        erros.hidden = false;
        botao.disabled = false;
        return;
      }
      const i = estado.lancamentos.findIndex((x) => x.id === r.lancamento.id);
      if (i >= 0) estado.lancamentos[i] = r.lancamento; else estado.lancamentos.push(r.lancamento);
      estado.mes = F.mesDe(r.lancamento.data);
      fecharModal();
      renderizar();
    });
  }

  function confirmarApagar(l) {
    const parcelado = l.forma === 'credito' && l.parcelas > 1;
    const modal = abrirModal('Apagar lançamento?',
      '<p class="texto-modal">“' + e(l.descricao) + '” de ' + brl(l.valor) + ' será apagado' +
      (parcelado ? ', junto com as ' + l.parcelas + ' parcelas' : '') + '. Não dá para desfazer.</p>' +
      '<p id="erros-form" class="erros" role="alert" hidden></p>' +
      '<div class="modal-rodape"><span class="espaco"></span><button type="button" class="botao-sec" id="btn-nao">Voltar</button>' +
      '<button type="button" class="botao-perigo-cheio" id="btn-sim">Apagar</button></div>');
    modal.querySelector('#btn-nao').addEventListener('click', () => abrirFormulario(l.id));
    modal.querySelector('#btn-sim').addEventListener('click', async () => {
      try {
        await estado.loja.apagarLancamento(l.id);
      } catch (err) {
        const out = modal.querySelector('#erros-form');
        out.textContent = textoErro(err, 'Não foi possível apagar. Tente de novo.');
        out.hidden = false;
        return;
      }
      estado.lancamentos = estado.lancamentos.filter((x) => x.id !== l.id);
      fecharModal();
      renderizar();
    });
  }

  // ---------- categorias: edição ----------

  const PALETA = ['#FF9F5A', '#38BDF8', '#6C8CFF', '#A78BFA', '#22D3EE', '#F472B6', '#E879F9', '#94A3B8', '#B0A3FF', '#FDBA74'];
  const centavosTxt = (c) => (c ? (c / 100).toFixed(2).replace('.', ',') : '');

  function abrirCategorias() {
    if (estado.semBanco) return;
    let trabalho = estado.categorias.map((c) => Object.assign({}, c, { removida: false, limiteTxt: centavosTxt(c.limite) }));

    const htmlLinha = (c, i) => {
      const usados = estado.lancamentos.filter((l) => l.categoriaId === c.id).length;
      let acao;
      if (c.id === 'outros') acao = '<span class="ce-fixa">Fixa</span>';
      else if (c.removida) acao = '<button type="button" class="botao-sec" data-acao="desfazer">Desfazer</button>';
      else acao = '<button type="button" class="botao-icone" data-acao="remover" aria-label="Remover ' + e(c.nome) + '">' + SETA('M3 3 L13 13 M13 3 L3 13') + '</button>';
      return '<div class="cat-edit' + (c.removida ? ' removida' : '') + '" data-linha="' + i + '">' +
        '<span class="cat-icone">' + I.svgIcone(c.id, 36) + '</span>' +
        '<input class="ce-nome" aria-label="Nome da categoria" value="' + e(c.nome) + '" maxlength="30">' +
        '<input class="ce-cor" type="color" aria-label="Cor de ' + e(c.nome) + '" value="' + e(c.cor) + '">' +
        '<input class="ce-limite" aria-label="Limite mensal de ' + e(c.nome) + ', em reais" inputmode="decimal" placeholder="Sem limite" value="' + e(c.limiteTxt) + '">' +
        acao +
        (c.removida ? '<p class="ce-aviso">Será removida ao salvar' + (usados ? '; ' + usados + (usados > 1 ? ' lançamentos vão' : ' lançamento vai') + ' para Outros' : '') + '.</p>' : '') +
        '</div>';
    };

    const modal = abrirModal('Categorias',
      '<p class="ajuda">Defina um limite mensal para ver a barra de progresso no painel. Deixe em branco para não ter limite.</p>' +
      '<div id="cat-linhas" class="cat-linhas"></div>' +
      '<p id="erros-form" class="erros" role="alert" hidden></p>' +
      '<div class="modal-rodape"><button type="button" class="botao-sec" id="btn-add-cat">Adicionar categoria</button><span class="espaco"></span>' +
      '<button type="button" class="botao-sec" id="btn-cancelar">Cancelar</button><button type="button" class="botao-principal" id="btn-salvar">Salvar</button></div>', true);
    const area = modal.querySelector('#cat-linhas');
    const erros = modal.querySelector('#erros-form');

    const desenhar = () => { area.innerHTML = trabalho.map(htmlLinha).join(''); };
    const ler = () => {
      area.querySelectorAll('.cat-edit').forEach((el) => {
        const c = trabalho[parseInt(el.dataset.linha, 10)];
        c.nome = el.querySelector('.ce-nome').value;
        c.cor = el.querySelector('.ce-cor').value;
        c.limiteTxt = el.querySelector('.ce-limite').value;
      });
    };
    desenhar();

    area.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-acao]');
      if (!b) return;
      ler();
      const c = trabalho[parseInt(b.closest('.cat-edit').dataset.linha, 10)];
      c.removida = b.dataset.acao === 'remover';
      desenhar();
    });
    modal.querySelector('#btn-add-cat').addEventListener('click', () => {
      ler();
      trabalho.push({ id: 'cat-' + F.novoId(), nome: 'Nova categoria', cor: PALETA[trabalho.length % PALETA.length], limite: null, removida: false, limiteTxt: '', nova: true });
      desenhar();
      const nomes = area.querySelectorAll('.ce-nome');
      const ultimo = nomes[nomes.length - 1];
      ultimo.focus();
      ultimo.select();
    });
    modal.querySelector('#btn-cancelar').addEventListener('click', fecharModal);

    modal.querySelector('#btn-salvar').addEventListener('click', async () => {
      ler();
      const msgs = [];
      const ativas = trabalho.filter((c) => !c.removida);
      const novas = ativas.map((c) => {
        const nome = c.nome.trim();
        if (!nome) msgs.push('Dê um nome a todas as categorias.');
        let limite = null;
        if (c.limiteTxt.trim() !== '') {
          limite = F.parseValor(c.limiteTxt);
          if (limite === null) msgs.push('Limite inválido em “' + (nome || 'sem nome') + '”.');
        }
        return { id: c.id, nome, cor: c.cor, limite };
      });
      const nomesBaixos = novas.map((c) => c.nome.toLowerCase());
      if (new Set(nomesBaixos).size !== nomesBaixos.length) msgs.push('Duas categorias têm o mesmo nome.');
      if (msgs.length) {
        erros.innerHTML = [...new Set(msgs)].map(e).join('<br>');
        erros.hidden = false;
        return;
      }
      const removidas = trabalho.filter((c) => c.removida && !c.nova).map((c) => c.id);
      let lanc = estado.lancamentos;
      for (const id of removidas) lanc = F.removerCategoria({ categorias: estado.categorias, lancamentos: lanc }, id).lancamentos;
      const alterados = lanc.filter((l, i) => l.categoriaId !== estado.lancamentos[i].categoriaId);
      try {
        await estado.loja.salvarCategorias(novas);
        if (alterados.length) await estado.loja.salvarLancamentos(alterados);
      } catch (err) {
        erros.textContent = textoErro(err, 'Não foi possível salvar. Tente de novo.');
        erros.hidden = false;
        return;
      }
      estado.categorias = novas;
      estado.lancamentos = lanc;
      if (removidas.includes(estado.filtro.categoriaId)) estado.filtro.categoriaId = '';
      montarFiltroCategorias();
      fecharModal();
      renderizar();
    });
  }

  async function iniciar(loja) {
    estado.loja = loja;
    let dados;
    try {
      dados = await loja.carregar();
    } catch (err) {
      semBanco('Não foi possível carregar seus lançamentos.');
      estado.loja = window.Loja.criarLojaMemoria();
      dados = { categorias: [], lancamentos: [] };
    }
    estado.lancamentos = dados.lancamentos;
    if (dados.categorias.length) {
      estado.categorias = dados.categorias;
    } else {
      estado.categorias = F.CATEGORIAS_INICIAIS.map((c) => Object.assign({}, c));
      try { await estado.loja.salvarCategorias(estado.categorias); } catch (err) { /* tenta de novo na próxima alteração */ }
    }
    estado.mes = F.mesDe(hoje());
    montarLista();
    ligarEventos();
    renderizar();
  }

  const textoErro = (err, padrao) => (window.Nuvem && err instanceof window.Nuvem.ErroSessao
    ? 'Sua sessão expirou. Toque em Sair e entre de novo.' : padrao);

  function mostrarAviso(texto) {
    const el = $('aviso');
    el.textContent = texto;
    el.hidden = false;
  }

  // Sem banco, a página só mostra o aviso: nada é salvo e os botões de lançar ficam desligados.
  function semBanco(motivo) {
    estado.semBanco = true;
    mostrarAviso(motivo + ' Nada que você lançar aqui será salvo.' + (window.CONFIG_NUVEM ? ' Confira a internet e abra a página de novo.' : ' Abra a página pelo link do Claude, com a sessão iniciada.'));
    $('btn-novo').disabled = true;
    $('btn-categorias').disabled = true;
    $('btn-atualizar').hidden = true;
  }

  const comPrazo = (promessa, ms) => Promise.race([promessa, new Promise((r) => setTimeout(() => r(null), ms))]);
  const capacidade = (nome) => (window.claude && window.claude.use
    ? comPrazo(Promise.resolve(window.claude.use(nome)), 10000).catch(() => null)
    : Promise.resolve(null));

  // Lê o banco de novo, sem sair do mês nem perder filtros. Serve para pegar mudanças feitas em outra aba
  // ou em outro aparelho. Se um formulário estiver aberto, não mexe na tela.
  let ultimaLeitura = Date.now();
  let atualizando = false;
  async function atualizar(silencioso) {
    if (atualizando || estado.semBanco || !estado.loja) return;
    if ($('camada').children.length) return;
    atualizando = true;
    const btn = $('btn-atualizar');
    btn.disabled = true;
    btn.textContent = 'Atualizando…';
    try {
      const dados = await estado.loja.carregar();
      estado.lancamentos = dados.lancamentos;
      if (dados.categorias.length) estado.categorias = dados.categorias;
      ultimaLeitura = Date.now();
      renderizar();
    } catch (err) {
      if (!silencioso || (window.Nuvem && err instanceof window.Nuvem.ErroSessao)) mostrarAviso(textoErro(err, 'Não foi possível atualizar agora. Tente de novo em instantes.'));
    } finally {
      atualizando = false;
      btn.disabled = false;
      btn.textContent = 'Atualizar';
    }
  }

  async function exportarCsv() {
    const dl = estado.downloads;
    if (!dl) return;
    const todos = estado.lancamentos.slice().sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));
    try {
      await dl.save({ filename: 'financas-' + hoje() + '.csv', data: F.paraCSV(todos, estado.categorias) });
    } catch (err) {
      if (err && err.code === 'declined') return;
      mostrarAviso('Não foi possível exportar o CSV. Tente de novo.');
    }
  }

  // Tela de login da versão instalável: só sai dela quem entrou com e-mail e senha corretos.
  function telaLogin(sessao) {
    return new Promise((resolve) => {
      const fundo = document.createElement('div');
      fundo.className = 'fundo-modal fundo-login';
      fundo.innerHTML = '<form class="modal login" novalidate>' +
        '<div class="marca login-marca"><span class="marca-selo" aria-hidden="true">' + document.querySelector('.marca-selo').innerHTML + '</span><span class="marca-nome">Finanças Família Rocha</span></div>' +
        '<h2 id="modal-titulo" class="cartao-titulo">Entrar</h2>' +
        '<p class="ajuda">Use o e-mail e a senha cadastrados para você.</p>' +
        '<p id="erro-login" class="erros" role="alert" hidden></p>' +
        '<label class="campo"><span class="rotulo">E-mail</span><input type="email" id="lg-email" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
        '<label class="campo"><span class="rotulo">Senha</span><input type="password" id="lg-senha" autocomplete="current-password"></label>' +
        '<button type="submit" class="botao-principal login-entrar">Entrar</button></form>';
      $('camada').appendChild(fundo);
      const form = fundo.querySelector('form');
      const erro = fundo.querySelector('#erro-login');
      const campoEmail = fundo.querySelector('#lg-email');
      campoEmail.focus();
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const email = campoEmail.value.trim();
        const senha = fundo.querySelector('#lg-senha').value;
        if (!email || !senha) { erro.textContent = 'Preencha o e-mail e a senha.'; erro.hidden = false; return; }
        const botao = form.querySelector('button[type="submit"]');
        botao.disabled = true;
        botao.textContent = 'Entrando…';
        try {
          await sessao.entrar(email, senha);
          fundo.remove();
          resolve();
        } catch (err) {
          erro.textContent = err.message;
          erro.hidden = false;
          botao.disabled = false;
          botao.textContent = 'Entrar';
        }
      });
    });
  }

  // Baixa o CSV pelo navegador (a versão instalável não tem o "downloads" do Claude).
  function downloadsDoNavegador() {
    return {
      async save({ filename, data }) {
        const blob = new Blob(['\uFEFF' + data], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      },
    };
  }

  async function abrirLojaNuvem() {
    const config = window.CONFIG_NUVEM;
    const sessao = window.Nuvem.criarSessao(config);
    if (sessao.retomar()) await sessao.renovar();
    if (!sessao.logado()) await telaLogin(sessao);
    const sair = $('btn-sair');
    sair.hidden = false;
    sair.addEventListener('click', () => { sessao.sair(); location.reload(); });
    return window.Nuvem.criarLojaSupabase(config, sessao);
  }

  async function abrirLoja() {
    if (window.DADOS_DEMO) return window.Loja.criarLojaMemoria(window.DADOS_DEMO);
    if (window.CONFIG_NUVEM) return abrirLojaNuvem();
    const db = await capacidade('db');
    const usuario = await capacidade('user');
    const uid = usuario ? await usuario.id() : null;
    return db && uid ? window.Loja.criarLojaDb(db, uid) : null;
  }

  async function partir() {
    $('resumo').innerHTML = '<p class="vazio">Abrindo suas finanças…</p>';
    estado.downloads = window.DADOS_DEMO ? null : window.CONFIG_NUVEM ? downloadsDoNavegador() : await capacidade('downloads');
    $('btn-exportar').hidden = !estado.downloads;
    let loja = null;
    try { loja = await abrirLoja(); } catch (err) { loja = null; }
    if (!loja) {
      semBanco('Não foi possível abrir o banco de dados desta página.');
      loja = window.Loja.criarLojaMemoria();
    }
    await iniciar(loja);
  }

  partir();
  window.MinhasFinancas = { estado, hoje, renderizar, mostrarAviso, categoria, montarFiltroCategorias };
})();

</script>
</body>
</html>
